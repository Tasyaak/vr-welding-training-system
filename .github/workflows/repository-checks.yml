name: Repository checks

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check repository hygiene
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).decode("utf-8").split("\0")

          tracked = [p for p in tracked if p]

          required = [
              "README.md",
              ".gitignore",
              ".gitattributes",
              ".editorconfig",
              "unity/Packages/manifest.json",
              "unity/Packages/packages-lock.json",
              "unity/ProjectSettings/ProjectVersion.txt",
          ]

          forbidden_prefixes = (
              "unity/Library/",
              "unity/Temp/",
              "unity/Obj/",
              "unity/Logs/",
              "unity/UserSettings/",
              "unity/Build/",
              "unity/Builds/",
              "unity/MemoryCaptures/",
              "unity/Recordings/",
          )

          errors = []

          for required_file in required:
              if required_file not in tracked:
                  errors.append(f"Required file is not tracked: {required_file}")

          for name in tracked:
              normalized = name.replace("\\", "/")

              if normalized.startswith(forbidden_prefixes):
                  errors.append(f"Generated Unity path is tracked: {name}")

              if (
                  normalized.endswith("/secrets.h")
                  or normalized.endswith("/config.local.h")
              ):
                  errors.append(f"Local/secret firmware file is tracked: {name}")

              if Path(normalized).name in {".DS_Store", "Thumbs.db"}:
                  errors.append(f"OS-generated file is tracked: {name}")

              path = Path(name)

              if path.is_file() and path.stat().st_size > 25 * 1024 * 1024:
                  errors.append(f"File exceeds 25 MiB: {name}")

          if errors:
              print("\n".join(f"ERROR: {e}" for e in errors))
              raise SystemExit(1)

          print("Repository checks passed.")
          PY